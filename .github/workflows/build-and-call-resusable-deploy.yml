name: Build and Call Reusable Deploy

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: windows-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Build Code
        run: dotnet build --configuration Release
      - name: Publish Code
        run: dotnet publish -c Release --property:PublishDir="${{env.DOTNET_ROOT}}\myapp"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}\myapp
          
  call-resusable-deployment-workflow-job:
    needs: build_job
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      package-name: .net-app
      app-name: appsvc1
      deployment-slot: development
    secrets:
      azure-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
      
